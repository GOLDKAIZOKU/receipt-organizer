# Every push: make sure all the code still compiles and the page script has no syntax errors.
name: Check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.9'}
      - run: python -m py_compile receipt_organizer/*.py run_app.py
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          python -c "import re;s=open('receipt_organizer/ui/index.html',encoding='utf-8').read();open('page.js','w',encoding='utf-8').write(re.findall(r'<script>(.*?)</script>',s,re.S)[-1])"
          node --check page.js
