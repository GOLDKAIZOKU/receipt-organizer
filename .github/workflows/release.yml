# When __version__ in receipt_organizer/__init__.py is a version that has no Release yet (pushed to main):
# build the Windows app and the Mac package, test both, and publish them as Release v<version>.
# The app checks this Release page and offers the update to everyone (Mac and Windows) at the same time.
name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      v: ${{ steps.v.outputs.v }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env: {GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
        run: |
          V=$(python3 -c "import re;print(re.search(r\"__version__ = '([^']+)'\",open('receipt_organizer/__init__.py').read()).group(1))")
          echo "v=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "new=false" >> "$GITHUB_OUTPUT"; echo "v$V already released"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi

  windows:
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-windows.txt pyinstaller
      - name: Build ReceiptOrganizer.exe
        run: >
          pyinstaller --noconfirm --windowed --name ReceiptOrganizer --icon assets/icon.ico
          --add-data "receipt_organizer/ui;receipt_organizer/ui" --add-data "entities.txt;."
          --collect-all webview --collect-all winrt --hidden-import clr run_app.py
      - name: Self-test the built app
        shell: bash
        env: {RO_SELFTEST_OPTIONAL: ocr}
        run: |
          ./dist/ReceiptOrganizer/ReceiptOrganizer.exe --selftest selftest.txt; code=$?
          cat selftest.txt; exit $code
      - name: Zip
        shell: pwsh
        run: |
          $v = python -c "import receipt_organizer as r;print(r.__version__)"
          Compress-Archive -Path dist/ReceiptOrganizer -DestinationPath "ReceiptOrganizer-Windows-$v.zip"
      - uses: actions/upload-artifact@v4
        with: {name: windows, path: 'ReceiptOrganizer-Windows-*.zip'}

  mac:
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Self-test (Apple Vision OCR, report, window library)
        run: |
          pip install -r requirements-mac.txt
          python -m receipt_organizer.gui --selftest selftest.txt; code=$?; cat selftest.txt; exit $code
      - name: Package
        run: |
          V=$(python -c "import receipt_organizer as r;print(r.__version__)")
          mkdir -p pkg/ReceiptOrganizer
          cp -R receipt_organizer mac assets requirements-mac.txt entities.txt README.md run_app.py pkg/ReceiptOrganizer/
          find pkg -name __pycache__ -prune -exec rm -rf {} +
          (cd pkg && zip -qr "../ReceiptOrganizer-Mac-$V.zip" ReceiptOrganizer)
      - uses: actions/upload-artifact@v4
        with: {name: mac, path: 'ReceiptOrganizer-Mac-*.zip'}

  release:
    needs: [version, windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {path: out, merge-multiple: true}
      - name: Publish release
        env: {GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
        run: |
          V=${{ needs.version.outputs.v }}
          NOTES=$(awk "/^## ${V//./\\.}\$/{f=1;next}/^## /{f=0}f" CHANGELOG.md)
          gh release create "v$V" out/*.zip --target "$GITHUB_SHA" --title "Receipt Organizer $V" --notes "${NOTES:-See CHANGELOG.md}"
