<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>单据整理</title>
<style>

*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased}

nav .m,.back{display:none}

.cardlang{display:flex;gap:8px}.cardlang button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 16px;cursor:pointer}.cardlang button[aria-pressed=true]{background:var(--sel);color:var(--accent);border-color:var(--accent);font-weight:600}

 #detail .vtools{flex-wrap:nowrap;overflow:hidden}.vtools button{white-space:nowrap;padding:4px 8px;min-width:0}.vtools [data-a=one]{display:none}.read{grid-template-columns:auto minmax(0,1fr)}
 input,select,textarea{font-size:16px}.mon button{flex:1 1 140px}table.t th,table.t td{padding:9px 10px}
}
.addent{display:flex;gap:6px}.addent input{flex:1;min-width:0}.snap{margin:6px 0 0;border:1px solid var(--line);border-radius:6px;background:var(--surface);overflow:hidden}.snap img{display:block;width:100%;max-height:74px;object-fit:contain;object-position:left center;background:var(--surface)}

.pk .n{position:absolute;top:6px;right:6px;background:var(--accent);color:var(--accent-ink);border-radius:50%;width:22px;height:22px;display:grid;place-items:center;font-size:12px;font-weight:700}
.dlg .acts{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px}
.dlg.wide>div{max-width:min(1100px,96vw);max-height:96vh}.cr{overflow:auto;padding:4px 18px;display:grid;place-items:start center}.cr .st{position:relative;user-select:none;-webkit-user-select:none;cursor:crosshair;touch-action:none}.cr .st img{display:block;max-height:calc(96vh - 210px);max-width:100%;background:#fff;pointer-events:none}.cr .bx{position:absolute;border:3px solid var(--accent);background:rgba(40,120,140,.12);box-sizing:border-box}.cr .bx.lk{border-style:dashed;border-color:var(--mute);background:rgba(120,120,120,.12)}.cr .bx b{position:absolute;left:-3px;top:-3px;background:var(--accent);color:var(--accent-ink);font-size:12px;padding:1px 7px;border-radius:0 0 6px 0}.cr .bx.lk b{background:var(--mute)}.cr .bx button{position:absolute;right:-3px;top:-3px;width:26px;height:26px;border:0;border-radius:0 0 0 6px;background:var(--bad);color:#fff;font-size:15px;cursor:pointer;line-height:1}
textarea{width:100%;min-height:110px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font-size:15px}
header{display:flex;align-items:center;gap:16px;padding:14px 24px;background:var(--surface);border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.01em}
header .where{color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer}
.btn:hover{border-color:var(--accent)}.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn:focus-visible,input:focus-visible,select:focus-visible,.row:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{display:grid;grid-template-columns:minmax(340px,.8fr) minmax(460px,1.2fr);min-height:0}
.list{overflow:auto;padding:18px 24px 40px}
.summary{display:flex;gap:28px;align-items:baseline;margin:0 0 14px}
.summary b{font-size:26px;font-weight:650;font-variant-numeric:tabular-nums}.summary span{color:var(--mute);font-size:13px;display:block}
.tabs{display:flex;gap:2px;margin-bottom:12px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;flex:none;background:none;border:0;padding:8px 10px;cursor:pointer;color:var(--mute);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected=true]{color:var(--ink);border-color:var(--accent);font-weight:600}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;padding:10px 12px;border-radius:10px;cursor:pointer;border:1px solid transparent}
.row:hover{background:var(--surface)}.row[aria-selected=true]{background:var(--sel);border-color:var(--accent)}
.row img{width:44px;height:56px;object-fit:cover;object-position:top;border-radius:4px;background:var(--bed);border:1px solid var(--line)}
.row .m{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{color:var(--mute);font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}.dot.hold{background:transparent;border:2px solid var(--mute);box-sizing:border-box}
.amt{font-variant-numeric:tabular-nums;font-weight:650;text-align:right}.amt small{display:block;color:var(--mute);font-weight:400;font-size:12px}
.empty{padding:60px 20px;text-align:center;color:var(--mute)}.empty h2{color:var(--ink);font-size:18px;margin:0 0 6px}
aside{background:var(--surface);border-left:1px solid var(--line);overflow:auto}
.bed{background:var(--bed);padding:20px;display:grid;place-items:center;max-height:46vh;overflow:auto}
.bed img{max-width:100%;max-height:42vh;box-shadow:0 2px 14px rgba(0,0,0,.18);background:#fff}
.form{padding:18px 22px 40px;display:grid;gap:14px}
.why{border-left:3px solid var(--warn);background:color-mix(in srgb,var(--warn) 9%,transparent);padding:10px 12px;border-radius:0 8px 8px 0;font-size:14px}
.why.fine{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,transparent)}
label{display:grid;gap:4px;font-size:13px;color:var(--mute)}
input,select{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font-size:15px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.read{font-size:13px;color:var(--mute);display:grid;grid-template-columns:auto 1fr;gap:2px 12px}.read b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.form .actions{position:sticky;bottom:0;z-index:3;background:var(--surface);margin:0 -22px;padding:12px 22px;border-top:1px solid var(--line);box-shadow:0 -6px 14px rgba(0,0,0,.06)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}.toast.on.act{pointer-events:auto}.toast.on{opacity:1}
.progress{padding:40px 24px}.progress pre{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;max-height:50vh;overflow:auto;font-size:12.5px;white-space:pre-wrap}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:12px 0}.bar i{display:block;height:100%;width:40%;background:var(--accent);animation:slide 1.4s ease-in-out infinite}
@keyframes slide{0%{margin-left:-40%}100%{margin-left:100%}}
@media (prefers-reduced-motion:reduce){.bar i{animation:none;width:100%}}
@media (max-width:860px){main{grid-template-columns:1fr}aside{border-left:0;border-top:1px solid var(--line)}header{flex-wrap:wrap}}

.vw{position:relative;background:var(--bed);height:100%;min-height:0;display:grid;grid-template-rows:1fr auto}
.stage{position:relative;overflow:hidden;cursor:grab;touch-action:none;min-height:0}
.stage.drag{cursor:grabbing}
.stage img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;box-shadow:0 2px 14px rgba(0,0,0,.25);background:#fff;user-select:none;-webkit-user-drag:none}
.vtools{display:flex;gap:4px;align-items:center;padding:8px 10px;overflow-x:auto;scrollbar-width:none;background:var(--surface);border-top:1px solid var(--line);font-size:13px;color:var(--mute)}
.vtools button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 8px;cursor:pointer;min-width:30px;white-space:nowrap;flex:none}.vtools button[data-a=auto]{border-color:var(--accent);color:var(--accent);font-weight:600}
.vtools button:hover{border-color:var(--accent)}.vtools .z{min-width:48px;text-align:center;font-variant-numeric:tabular-nums}.vtools .sp{flex:1}
.pane{display:grid;grid-template-rows:minmax(240px,52vh) 1fr;height:100%}
.pane .form{overflow:auto}
.ov{position:fixed;inset:0;background:rgba(10,14,18,.86);z-index:20;display:none;grid-template-rows:auto 1fr}
.ov.on{display:grid}.ov .top{display:flex;gap:12px;align-items:center;padding:10px 16px;color:#e6ebf0}.ov .top b{flex:1}
.ov .vw{background:transparent}.ov .btn{background:#222c35;color:#e6ebf0;border-color:#33414d}
kbd{font:12px var(--font);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--surface);color:var(--mute)}
.hint{color:var(--mute);font-size:12.5px;display:flex;gap:14px;flex-wrap:wrap}
aside{overflow:hidden}
</style></head>
<body><div class="app">
<nav id="nav"><h1>单据整理</h1>
 <button data-v="home">首页</button><button data-v="review">待确认 <em id="nb"></em></button><button data-v="all"><span class="d">全部单据</span><span class="m">全部</span></button><button data-v="browse"><span class="d">按公司 / 年 / 月</span><span class="m">月份</span></button><button data-v="settings">设置</button>
 <button class="rfsh" id="rfsh" title="重新应用最新规则:改名、分类、重复检查。你的更正不会被覆盖">↻ 刷新</button>
 <div class="langsw" role="group" aria-label="Language"><button data-lang="en" aria-pressed="true">English</button><button data-lang="zh" aria-pressed="false">中文</button></div>
 <div class="where" id="where"></div></nav>
<div class="content"><section id="page"></section><main id="main" hidden><section class="list" id="list"></section><aside id="detail"></aside></main></div></div>
<div class="ov" id="ov"><div class="top"><b id="ovt"></b><span class="hint"><span><kbd>滚轮</kbd> 缩放</span><span><kbd>拖动</kbd> 平移</span><span><kbd>双击</kbd> 100%/适合</span><span><kbd>Esc</kbd> 关闭</span></span><button class="btn" id="ovx">关闭</button></div><div id="ovbody"></div></div>
<div class="toast" id="toast" role="status"></div>
<script>
const T='__TOKEN__';let ROWS=[],SEL=null,TAB='all',ENTS=['Personal'];
const $=s=>document.querySelector(s);
const api=(p,b)=>fetch(p+(p.includes('?')?'&':'?')+'t='+T,b?{method:'POST',headers:{'X-Token':T,'Content-Type':'application/json'},body:JSON.stringify(b)}:{}).then(r=>r.json());
const rm=n=>n==null?'—':'RM '+Number(n).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});
const dmy=d=>{if(!d)return'';const[a,b,c]=d.split('-');return`${c.padStart(2,'0')}/${b.padStart(2,'0')}/${a}`};
const iso=v=>{v=(v||'').trim();if(!v)return'';const im=v.match(/^(\d{4})\D(\d{1,2})\D(\d{1,2})$/);if(im)v=`${im[3]}/${im[2]}/${im[1]}`;let m=v.match(/^(\d{1,2})\D+(\d{1,2})\D+(\d{2}|\d{4})$/)||v.match(/^(\d{2})(\d{2})(\d{4}|\d{2})$/);if(!m)return null;let[,d,mo,y]=m;y=y.length==2?'20'+y:y;const t=new Date(+y,+mo-1,+d);if(t.getMonth()!=+mo-1||t.getDate()!=+d)return null;return`${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`};
const fd=d=>{if(!d)return'没有日期';const[a,b,c]=d.split('-');return`${+c}/${+b}/${a}`};
let _tt=null;const toast=m=>{const t=$('#toast');t.classList.remove('act');t.textContent=m;t.classList.add('on');clearTimeout(_tt);_tt=setTimeout(()=>t.classList.remove('on'),2200)};
function toastUndo(m,ids){const t=$('#toast');t.innerHTML='';t.append(m+'  ');const b=document.createElement('button');b.className='btn';b.textContent='撤销';b.style.marginLeft='8px';
 b.onclick=async()=>{const d=await api('/api/undelete',{ids});ROWS=d.rows;render();toast('已恢复')};t.append(b);t.classList.add('on','act');clearTimeout(_tt);_tt=setTimeout(()=>t.classList.remove('on'),8000)}
const counted=r=>!r.duplicate&&!r.card_slip_of;
const isDup=r=>!r.card_slip_of&&!r.hold&&(r.duplicate||(r.review||'').includes('Possible duplicate'));
const isRev=r=>!!r.review&&!r.hold&&!r.duplicate,isOk=r=>!r.review&&!r.hold&&!r.duplicate;
function level(r){if(r.hold||r.duplicate)return 'hold';if(r.review)return r.review.includes('Date missing')||r.review.includes('Check crop')||r.review.includes('Check rotation')?'bad':'warn';return 'ok'}
const REASON={'Confirm merchant':'商家名称不在名单里,请对照图片确认或改正。','Check rotation':'无法确定这张是否正着放,请看图;不对就按 [ 或 ] 旋转。','Check crop':'这张可能被切到或需要手动旋转,请看图确认。','Date missing':'读不出日期,请对照图片输入。','Confirm date':'日期不够确定,请确认。','Confirm total':'两种识别读出的总额不同,请对照图片选一个。','Possible duplicate':'和另一张的商家、日期、总额完全相同,可能是同一张单据扫了两次。'};
function why(r){const p=[];(r.review||'').split(' / ').filter(Boolean).forEach(x=>p.push(REASON[x]||x));
 if(r.date_status.startsWith('DISAGREE'))p.push('日期:'+r.date_status.replace('DISAGREE ocr','OCR 读成').replace('/ ai','、AI 读成'));
 if(r.total_status.startsWith('DISAGREE'))p.push('总额:'+r.total_status.replace('DISAGREE ocr','OCR 读成').replace('/ ai','、AI 读成'));
 else if(r.total_status.includes('confirm'))p.push('总额只有一个来源读出,请核对。');
 if(r.merchant_status.includes('check'))p.push('商家不在名单里,请确认名称。');
 (r.notes||'').split(' | ').filter(Boolean).forEach(n=>{if(/below subtotal/.test(n))p.push('总额比小计还小,可能读错(也可能有折扣)。')});
 return p}

function makeViewer(host,src,full){

const trs=s=>{if(LANG!=='en'||!/[一-鿿]/.test(s))return s;for(const [r,v] of EN_RE)s=s.replace(r,v);for(const [k,v] of EN_STR)if(s.includes(k))s=s.split(k).join(v);return s};
const ORIG=new WeakMap(),CJK=/[一-鿿]/;
function applyLang(root){root=root||document.body;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),ns=[];let n;while((n=w.nextNode()))ns.push(n);
 for(const t of ns){if(!ORIG.has(t)){if(!CJK.test(t.nodeValue))continue;ORIG.set(t,t.nodeValue)}const o=ORIG.get(t),v=LANG==='en'?trs(o):o;if(t.nodeValue!==v)t.nodeValue=v}
 (root.querySelectorAll?root.querySelectorAll('[placeholder]'):[]).forEach(e=>{if(e.dataset.zhp===undefined){if(!CJK.test(e.placeholder))return;e.dataset.zhp=e.placeholder}const v=LANG==='en'?trs(e.dataset.zhp):e.dataset.zhp;if(e.placeholder!==v)e.placeholder=v});
 (root.querySelectorAll?root.querySelectorAll('[title]'):[]).forEach(e=>{if(e.dataset.zh===undefined){if(!CJK.test(e.title))return;e.dataset.zh=e.title}const v=LANG==='en'?trs(e.dataset.zh):e.dataset.zh;if(e.title!==v)e.title=v});
 const tt=LANG==='en'?'Receipt Organizer':'单据整理';if(document.title!==tt)document.title=tt;document.documentElement.lang=LANG==='en'?'en':'zh-CN'}
let _lp=false;new MutationObserver(()=>{if(_lp)return;_lp=true;queueMicrotask(()=>{_lp=false;applyLang()})}).observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['title','placeholder']});
function setLang(l){LANG=l==='en'?'en':'zh';try{localStorage.setItem('ro_lang',LANG)}catch(e){}applyLang();document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===LANG)))}
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));$('#rfsh').onclick=refresh;

setLang(LANG);
load();
